<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="수입과 지출을 한눈에 관리하는 프리미엄 가계부 대시보드" />
  <title>내 가계부 | My Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <svg width="48" height="48" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="128" fill="#6c5ce7"/>
          <rect x="112" y="144" width="288" height="224" rx="32" fill="none" stroke="#ffffff" stroke-width="32"/>
          <path d="M112 256h288M256 368V256" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
        </svg>
        <h2>내 가계부 로그인</h2>
      </div>
      <div class="login-body">
        <input type="text" id="login-id" class="tx-input" placeholder="아이디" />
        <input type="password" id="login-pw" class="tx-input" placeholder="비밀번호" />
        <button id="login-btn" class="tx-submit" style="margin-top:20px; width:100%">로그인</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="18" rx="3"/>
              <path d="M2 9h20"/>
              <path d="M9 21V9"/>
            </svg>
          </div>
          <span class="logo-text">내 가계부</span>
        </div>
      </div>

      <!-- Month Navigation -->
      <div class="sidebar-section">
        <div class="month-nav">
          <button id="prev-month" class="month-btn" title="이전 달">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <span id="current-month" class="current-month"></span>
          <button id="next-month" class="month-btn" title="다음 달">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="sidebar-section">
        <div class="section-label">이번 달 요약</div>
        <div class="quick-stats">
          <div class="stat-card stat-income">
            <div class="stat-label">수입</div>
            <div class="stat-value" id="sidebar-income">₩0</div>
          </div>
          <div class="stat-card stat-expense">
            <div class="stat-label">지출</div>
            <div class="stat-value" id="sidebar-expense">₩0</div>
          </div>
          <div class="stat-card stat-balance">
            <div class="stat-label">잔액</div>
            <div class="stat-value" id="sidebar-balance">₩0</div>
          </div>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="sidebar-section">
        <div class="section-label">카테고리 필터</div>
        <div id="category-filters" class="category-filters"></div>
      </div>

      <div class="sidebar-footer">
        <button id="install-btn" class="export-btn" title="앱 설치하기" style="display:none; margin-right:6px; background:linear-gradient(135deg, var(--accent), #a855f7); color:#fff; border:none; box-shadow:0 0 12px var(--accent-glow);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          설치
        </button>
        <button id="export-btn" class="export-btn" title="데이터 내보내기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          내보내기
        </button>
        <button id="reset-btn" class="export-btn" title="전체 초기화">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
        </button>
      </div>
      <div style="padding: 10px 20px;">
        <button id="logout-btn" class="export-btn" title="로그아웃" style="width:100%; border-radius:12px; background:rgba(255,255,255,0.05);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> 로그아웃
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <header class="topbar">
        <button id="sidebar-toggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="page-title" id="page-title">대시보드</h1>
        <div class="topbar-right">
          <div class="view-toggle">
            <button id="view-dashboard" class="view-btn active" title="대시보드">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </button>
            <button id="view-list" class="view-btn" title="목록">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/>
                <line x1="3" y1="12" x2="3.01" y2="12"/>
                <line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
            </button>
            <button id="view-calendar" class="view-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>캘린더
            </button>
            <button id="view-admin" class="view-btn" style="display:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>관리자
            </button>
          </div>
          <button id="add-transaction-btn" class="add-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            내역 추가
          </button>
        </div>
      </header>

      <div id="dashboard-view" class="dashboard-view"></div>
      <div id="list-view" class="list-view" style="display:none;"></div>
      <!-- Calendar View -->
      <div id="calendar-view" class="view-content" style="display:none;"></div>

      <!-- Admin View -->
      <div id="admin-view" class="view-content" style="display:none;">
        <div class="card">
          <div class="card-title">새 사용자 등록</div>
          <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="new-user-id" class="tx-input" placeholder="아이디" style="width:200px;">
            <input type="password" id="new-user-pw" class="tx-input" placeholder="비밀번호" style="width:200px;">
            <button id="create-user-btn" class="tx-submit" style="width:120px; margin:0;">계정 생성</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">사용자 목록</div>
          <div id="user-list" class="tx-list" style="margin-top:10px;"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div id="transaction-modal" class="modal" style="display:none;">
    <div class="modal-backdrop" id="tx-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="tx-modal-title">새 내역 추가</h3>
        <button class="modal-close" id="tx-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tx-type-toggle">
          <button id="tx-type-expense" class="tx-type-btn active" data-type="expense">지출</button>
          <button id="tx-type-income" class="tx-type-btn" data-type="income">수입</button>
        </div>
        <div class="input-group">
          <label class="form-label">금액</label>
          <div class="amount-input-wrap">
            <span class="currency-symbol">₩</span>
            <input type="text" id="tx-amount" class="form-input amount-input" placeholder="0" inputmode="numeric" />
          </div>
        </div>
        <div class="input-group">
          <label class="form-label">카테고리</label>
          <div id="tx-categories" class="tx-categories"></div>
        </div>
        <div class="input-group">
          <label class="form-label">날짜</label>
          <input type="date" id="tx-date" class="form-input" />
        </div>
        <div class="input-group">
          <label class="form-label">메모</label>
          <input type="text" id="tx-memo" class="form-input" placeholder="어디에서 사용했나요?" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="tx-delete" style="margin-right:auto; display:none;">삭제</button>
        <button class="btn btn-secondary" id="tx-cancel">취소</button>
        <button class="btn btn-primary" id="tx-submit">추가</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
